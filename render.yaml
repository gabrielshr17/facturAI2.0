services:
  - type: web
    name: facturai-remoto
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @sfr/remoto build
    staticPublishPath: packages/remoto/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

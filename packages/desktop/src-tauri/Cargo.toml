[package]
name = "sistema-facturacion"
version = "0.0.0"
description = "Sistema de facturación, inventario y gestión (RD)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sistema_facturacion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# tauri-plugin-powersync / powersync (y sus deps reqwest/serde/async-trait/
# thiserror, usadas solo por src/sync/) DESACTIVADOS — ver comentario en
# lib.rs: conflicto real de libsqlite3-sys con tauri-plugin-sql que rompe
# `cargo check`, y el conector no sincronizaba datos de todas formas.
dotenvy = "0.15"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Foundation", "Win32_System_Diagnostics_Debug"] }
